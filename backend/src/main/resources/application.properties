server.port=8080
spring.application.name=kaboom-backend

# Allow the Vite dev server (comma-separated; change for production)
app.cors.allowed-origins=http://localhost:5173

# Permanent storage: H2 file database (creates ./data/kaboom.mv.db next to where you run mvn)
spring.datasource.url=jdbc:h2:file:./data/kaboom
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.h2.console.enabled=false

# Login sessions: "remember me" ticked = this many days, not ticked = this many hours
app.auth.token-days=30
app.auth.session-hours=12

# Address of the frontend, used to build the "set a new password" link in e-mails
app.frontend-url=http://localhost:5173

# Sending e-mail ("forgot password"). Put the account in ENVIRONMENT VARIABLES, never in this file:
#   SPRING_MAIL_HOST=smtp.gmail.com
#   SPRING_MAIL_PORT=587
#   SPRING_MAIL_USERNAME=your-address@gmail.com
#   SPRING_MAIL_PASSWORD=<Gmail App Password, 16 letters>
# Until SPRING_MAIL_HOST is set, the link is printed in the backend console instead of being e-mailed.
app.mail.from=${SPRING_MAIL_USERNAME:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.connectiontimeout=10000
spring.mail.properties.mail.smtp.timeout=10000
spring.mail.properties.mail.smtp.writetimeout=10000
